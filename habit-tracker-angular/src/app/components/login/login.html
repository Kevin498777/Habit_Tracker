<div class="container fade-in">
  <h2>Iniciar Sesión</h2>

  <div class="form-group">
    <label for="loginEmail">Usuario o Email</label>
    <input id="loginEmail" type="email" placeholder="Ingresa tu correo electrónico"
           [(ngModel)]="email" />
  </div>

  <div class="form-group">
    <label for="loginPassword">Contraseña</label>
    <input id="loginPassword" type="password" placeholder="Ingresa tu contraseña"
           [(ngModel)]="password" />
  </div>

  <div class="form-check">
    <input type="checkbox" id="remember" [(ngModel)]="rememberMe" />
    <label for="remember">Recordar mis datos</label>
  </div>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <button (click)="onLogin()">Iniciar Sesión</button>

  <div class="divider"><span>o</span></div>

  <button class="google" (click)="onGoogleLogin()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" />
    Continuar con Google
  </button>

  <div class="link-row">
    <span>¿No tienes una cuenta?</span>
    <button class="secondary" (click)="goToRegister()">Crear Cuenta</button>
  </div>
</div>
