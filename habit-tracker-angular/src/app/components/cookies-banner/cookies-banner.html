<div class="banner show" *ngIf="showBanner">
  <div class="banner-content">
    <div class="banner-text">
      <h5>🍪 Uso de Cookies</h5>
      <p>
        Utilizamos cookies esenciales para el funcionamiento del sitio y cookies opcionales para mejorar tu experiencia.
        Puedes gestionar tus preferencias en cualquier momento.
        <a (click)="goToPolicy()">Más información</a>
      </p>
    </div>
    <div class="banner-actions">
      <button class="btn-essential" (click)="acceptEssential()">Solo Esenciales</button>
      <button class="btn-accept" (click)="acceptAll()">Aceptar Todas</button>
      <button class="btn-customize" (click)="customize()">Personalizar</button>
    </div>
  </div>
</div>
