<div class="container fade-in">

  <div class="shield-icon">🔐</div>
  <h2>Verificación en Dos Pasos</h2>
  <p class="subtitle">Enviamos un código de 6 dígitos a <strong>{{ maskedEmail }}</strong></p>

  <!-- Enviando... -->
  <div class="sending-box" *ngIf="sending">
    <span class="spinner">⏳</span> Enviando código a tu correo...
  </div>

  <!-- Éxito de envío -->
  <div class="success-send" *ngIf="successMsg && !sending">
    <span>📧</span> {{ successMsg }}
  </div>

  <!-- Timer -->
  <div class="timer" *ngIf="!sending && timeLeft > 0" [class.expiring]="timeLeft <= 60">
    <span>⏱ Expira en: </span><strong>{{ formattedTime }}</strong>
  </div>

  <!-- Input del código -->
  <div class="input-group" *ngIf="!sending">
    <label>Ingresa el código de 6 dígitos</label>
    <input
      type="text"
      maxlength="6"
      placeholder="_ _ _ _ _ _"
      [(ngModel)]="otpInput"
      (keyup.enter)="verify()"
      class="otp-input"
      [disabled]="timeLeft <= 0"
    />
  </div>

  <!-- Error -->
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <!-- Verificar -->
  <button class="btn-verify" (click)="verify()"
          [disabled]="otpInput.length < 6 || sending || timeLeft <= 0"
          *ngIf="!sending">
    ✅ Verificar Código
  </button>

  <!-- Reenviar -->
  <button class="btn-regenerate" (click)="resend()" [disabled]="sending">
    🔄 Reenviar código al correo
  </button>

  <button class="btn-cancel" (click)="cancelLogin()">
    ← Cancelar y volver al login
  </button>

</div>
